# madc.ini — example configuration file for madc(1).
#
# madc reads ONE configuration file; the first existing file wins
# outright (files are never merged):
#
#     ./madc.ini
#     $XDG_CONFIG_HOME/madc/madc.ini    (or ~/.config/madc/madc.ini)
#     <sysconfdir>/madc.ini             (baked at build time)
#
# Settings resolve most-specific-first: command line > environment >
# madc.ini > built-in defaults. An unknown key or malformed line is an
# ERROR — a configuration file that half-applies is worse than one that
# refuses. Comments start with # or ;. Values may be quoted. Relative
# paths resolve against this file's own directory; a leading ~/ expands.
#
# Every key below is commented out — as shipped, this file changes
# nothing. Uncomment what you need.

[madc]

# Default language standard (what --std= would set).
#std = madc

# Default C++ standard library flavor (what -stdlib= would set),
# in clang's spelling: libstdc++ or libc++.
#stdlib = libstdc++

# Frozen forest container — the LAST forest-discovery arm (the binary's
# own image, the libmadc image, the <exe>.forest / <lib>.forest
# sidecars, and $MADC_FOREST all outrank it).
#forest = ~/.local/share/madc/forest.bin

# Additional include directory, searched after every -I from the
# command line. Repeatable.
#include = ~/include

# Default CPU-time guard in seconds (MADC_CPU_LIMIT overrides; 0
# disables). madc also runs the program, so there is no finite default.
#cpu-limit = 0

# Default address-space guard in MB (MADC_MEM_LIMIT overrides; 0
# disables).
#mem-limit = 4096
