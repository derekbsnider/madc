# release.yml — the PK5 release workflow (packaging arc,
# docs/plans/2026-09-01-packaging-arc.md).
#
# BOUNDARY (owner ruling 2026-09-01): Actions = build + smoke ONLY. The
# full battery remains the local push gate (container + lane ledger,
# .claude/rules/testing-fulltest.md) — a v* tag only exists on content
# the local lane-freshness gate already validated, so the packagers run
# with MADC_PKG_SKIP_SUITE=1 here and the smoke is the PK4 install gate
# (scripts/package_install_gate.sh) already wired inside them: the
# extracted/zipped ARTIFACT bytes run their installed binaries, every
# probe with its negative control.
#
# ASSET OWNERSHIP: this workflow builds and attaches ALL SIX release
# assets — the artifacts PK6's ecosystem repos consume at stable
# versioned URLs (releases/download/<tag>/<file>): Linux (.deb, .rpm,
# tarball) and Windows (.zip, mingw cross + wine smoke) on ubuntu, and the
# two macOS tarballs NATIVELY on GitHub's mac runners (macos-14 = arm64,
# macos-15-intel = x86_64) — the darwin-host build port
# (docs/plans/2026-09-01-darwin-host-port.md, D3). On a mac runner the
# hosted madc self-freezes the darwin groves from PINNED inputs (the open
# darwin C headers, the build container's exact libc++ 18.1.3 text, zstd
# v1.5.5 built by the hosted MODE's own compiler line), so the runner-built
# tarball is release-equivalent to the container's cross build BY
# CONSTRUCTION — and it is the one that ships: the owner's Apple SDK never
# leaves the owner's machines, and the local `make release-macos` cross
# build is a verification lane (its tarballs are never uploaded; two
# producers of one asset would desynchronize the checksums). The mac
# smoke = the PK4 mactar install gate inside the packager (extract, run,
# the Mac battery's PASS floor, the hidden-archive negative control) on
# the exact tarball bytes. The checksum step rewrites only the lines of
# files it uploads (the rewrite-own-lines-only discipline the local
# packagers use on dist/SHA256SUMS).
#
# The windows job mirrors the container's /workspace layout on the
# runner (UCRT-flavor libstdc++ stage, zstd v1.5.5 checkout) so the
# build scripts run unchanged; the UCRT stage is cached — the stage
# script is idempotent and exits fast on a warm cache. The cache must
# include the two gcc license files: package_release_windows.sh ships
# them, and a stage-only cache hit would skip the source fetch that
# provides them.
# AUTOMATIC RUNS ARE FOR MASTER PROMOTIONS ONLY (owner, 2026-09-01):
# /release cuts milestone v* tags ON develop too, and those must not
# spin release builds. The gate job skips the build jobs unless the
# pushed tag's commit is an ancestor of master (a promotion tag) —
# workflow_dispatch always builds (manual = intentional, e.g. a re-run
# or a test against a draft).
name: release
run-name: "release ${{ inputs.tag || github.ref_name }}"

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag to attach assets to (vX.Y.Z; must equal the VERSION file at the built ref)'
        required: true
      build_ref:
        description: 'ref to build (default: the tag itself)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: master promotions build automatically; develop milestone tags do not
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch — building"
            exit 0
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/master...$GITHUB_SHA" --jq .status)
          if [ "$status" = "identical" ] || [ "$status" = "behind" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "tag is on master (promotion) — building"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "tag not on master (compare status: $status) — a develop milestone tag; skipping release builds"
          fi

  linux-packages:
    runs-on: ubuntu-24.04
    needs: gate
    if: needs.gate.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref || inputs.tag || github.ref_name }}
      - name: guard — tag matches VERSION
        run: |
          ver=$(cat VERSION)
          if [ "$RELEASE_TAG" != "v$ver" ]; then
            echo "tag $RELEASE_TAG != v$ver (VERSION at the built ref)" >&2
            exit 1
          fi
      - name: dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            g++-13 clang make autoconf rpm cpio libzstd-dev zlib1g-dev
      - name: configure
        # configure and include/config.h.in are autoconf/autoheader OUTPUT,
        # untracked by design — a clean checkout regenerates them
        # (autoreconf = autoconf + autoheader; proven in a clean clone).
        run: |
          autoreconf -i
          ./configure
      - name: build + package + install-gate smoke (deb, rpm, tarball)
        run: |
          # Suite skipped, citation: a v* tag exists only on content the
          # local lane-freshness gate ran green on (docs/lane-status.tsv
          # at the tagged commit); the PK4 gates inside the packager are
          # this job's smoke. No restore: the runner is discarded.
          MADC_PKG_SKIP_SUITE=1 MADC_PKG_NO_RESTORE=1 \
            bash scripts/package_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/madc_*.deb
            dist/madc-*.x86_64.rpm
            dist/madc-*-linux-x86_64.tar.gz
          if-no-files-found: error

  windows-package:
    runs-on: ubuntu-24.04
    needs: gate
    if: needs.gate.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref || inputs.tag || github.ref_name }}
      - name: guard — tag matches VERSION
        run: |
          ver=$(cat VERSION)
          if [ "$RELEASE_TAG" != "v$ver" ]; then
            echo "tag $RELEASE_TAG != v$ver (VERSION at the built ref)" >&2
            exit 1
          fi
      - name: dependencies
        # libc++-18-dev/abi: verify_pe_release's one-flavor gate probes the
        # shipped PE with -stdlib=libc++ — the ALTERNATE flavor must be a
        # viable posture on the build host for the probe to reach the
        # profile-stack walk (the container carries it via provisioning).
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            g++-13 clang make autoconf g++-mingw-w64-x86-64-posix \
            binutils-mingw-w64-x86-64 wine64 zip unzip wget \
            libzstd-dev zlib1g-dev libz-mingw-w64-dev \
            libc++-18-dev libc++abi-18-dev
          sudo mkdir -p /workspace
          sudo chown "$USER" /workspace
      - name: UCRT-flavor libstdc++ stage (cached)
        uses: actions/cache@v4
        with:
          path: |
            /workspace/win-ucrt-libstdc++/stage
            /workspace/win-ucrt-libstdc++/gcc-13.2.0/COPYING3
            /workspace/win-ucrt-libstdc++/gcc-13.2.0/COPYING.RUNTIME
          key: ucrt-libstdcxx-${{ hashFiles('scripts/build_win_ucrt_libstdcxx.sh') }}
      - name: build UCRT stage if not cached
        run: bash scripts/build_win_ucrt_libstdcxx.sh
      - name: win64 zstd stage (the provision_container.sh recipe)
        run: |
          git clone --depth 1 --branch v1.5.5 \
            https://github.com/facebook/zstd.git /workspace/zstd
          make -C /workspace/zstd/lib -j"$(nproc)" BUILD_DIR=obj-win64 \
            CC='x86_64-w64-mingw32-gcc-posix -D_UCRT -D__USE_MINGW_ANSI_STDIO=1' \
            AR=x86_64-w64-mingw32-ar libzstd.a
          cp -p /workspace/zstd/lib/libzstd.a /workspace/zstd/libzstd-x86-64-windows.a
          rm -f /workspace/zstd/lib/libzstd.a
      - name: configure
        # see the linux job: configure is generated output, untracked.
        run: |
          autoreconf -i
          ./configure
      - name: initialize wine prefix
        # A fresh runner HOME has no ~/.wine; without this, the FIRST wine
        # invocation happens inside forest_pack_windows.sh's freeze and the
        # prefix bootstrap (noisy, and wine64-only warns about missing
        # 32-bit parts) fails the freeze-append. Boot it once, wait for the
        # bootstrap to settle, and keep a persistent server (the container
        # lesson: without wineserver -p the first run produces phantoms).
        run: |
          export WINEDEBUG=-all
          wineboot --init || true
          wineserver -w || true
          wineserver -p || true
      - name: build release PE
        run: |
          export WINEDEBUG=-all
          make -C src -j"$(nproc)" release-windows
      - name: package + install-gate smoke (zip under wine)
        run: bash scripts/package_release_windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/madc-*-windows-x86_64.zip
          if-no-files-found: error

  macos-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86-64
    runs-on: ${{ matrix.runner }}
    needs: gate
    if: needs.gate.outputs.build == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref || inputs.tag || github.ref_name }}
      - name: guard — tag matches VERSION
        run: |
          ver=$(cat VERSION)
          if [ "$RELEASE_TAG" != "v$ver" ]; then
            echo "tag $RELEASE_TAG != v$ver (VERSION at the built ref)" >&2
            exit 1
          fi
      - name: brew deps (llvm@18 = the parity compiler) + the gnubin build-host userland
        run: |
          # zstd here is the CLI (the pinned libc++ deb is zstd-compressed);
          # the codec madc LINKS is the pinned v1.5.5 stage below.
          # automake: brew's autoreconf insists on aclocal for a plain
          # autoconf project.
          brew install llvm@18 zstd autoconf automake coreutils gnu-sed grep bash make 2>&1 | tail -3
          for f in make coreutils gnu-sed grep; do
            echo "$(brew --prefix $f)/libexec/gnubin" >> "$GITHUB_PATH"
          done
          # The three staged INPUT trees, each at its fetch/stage script's
          # location knob — the Makefile's darwin-host defaults read the
          # same knobs (DARWIN_PRELUDE_SYSROOT, LLVM_LIBCXX_INC,
          # DARWIN_ZSTD_DIR: an explicit stage dir wins over brew zstd).
          echo "DARWIN_OPEN_HEADERS_HOME=$HOME/darwin-open-headers" >> "$GITHUB_ENV"
          echo "LIBCXX_HEADERS_HOME=$HOME/libcxx-headers" >> "$GITHUB_ENV"
          echo "DARWIN_ZSTD_DIR=$HOME/zstd" >> "$GITHUB_ENV"
      - name: fetch the pinned input trees (darwin open C headers; the container's exact libc++ text + copyright)
        run: |
          make --version | head -1
          bash scripts/fetch_darwin_open_headers.sh
          cat "$DARWIN_OPEN_HEADERS_HOME/sysroot-any-darwin-any/.PROVENANCE"
          bash scripts/fetch_libcxx_headers.sh
          cat "$LIBCXX_HEADERS_HOME/.PROVENANCE"
          test -s "$LIBCXX_HEADERS_HOME/copyright"
      - name: autoreconf + configure (forest EMBEDDED — the default)
        run: |
          autoreconf -i
          # --enable-madcdat=no: the hosted MODE forces it off anyway; the
          # runner's brew gdbm/sqlite otherwise leak into probed defines.
          # CPPFLAGS/LDFLAGS: configure's host zstd probe needs the brew prefix.
          ./configure --enable-madcdat=no \
            CPPFLAGS="-I$(brew --prefix)/include" LDFLAGS="-L$(brew --prefix)/lib"
      - name: pinned zstd v1.5.5 — the per-target static stage the hosted MODE links (its own CC/AR)
        run: bash scripts/stage_darwin_zstd.sh ${{ matrix.arch }}
      - name: the derived DARWIN_HOST posture (evidence)
        run: |
          for v in HOST_OS HOST_DARWIN_ARCH DARWIN_HOST DARWIN_SELF_FREEZE DARWIN_FREEZER \
                   DARWIN_CLANG DARWIN_LD_FLAGS MACOS_SDK LLVM_LIBCXX_INC DARWIN_PRELUDE_SYSROOT \
                   DARWIN_ZSTD_DIR DARWIN_ZSTD_INC DARWIN_ZSTD_LIB RELEASE_MACOS_ARCHES; do
            printf '%-24s = %s\n' "$v" "$(make -C src -s MODE=hosted-${{ matrix.arch }}-macos print-$v)"
          done
      - name: make release-macos — host arch, self-frozen, stripped, verified
        run: |
          make -C src -j"$(sysctl -n hw.ncpu)" release-macos 2>&1 | tee release-make.log
          test "${PIPESTATUS[0]}" -eq 0
          echo "=== freeze + verify evidence ==="
          grep -E "forest_pack_gate:|forest_pack_darwin: OK|verify_macho_release:|Froze " release-make.log
          echo "forest units (baseline 835):"
          bin/madc-hosted-${{ matrix.arch }}-macos --dump-forest=obj/hosted-${{ matrix.arch }}-macos/forest.bin | grep -c '^unit	'
      - name: "package + install-gate smoke (tarball: extract, run, Mac battery floor, negative control)"
        # host arch by default; the packager re-verifies the exact bytes it
        # tars, then runs scripts/package_install_gate.sh mactar on the tarball.
        run: bash scripts/package_release_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package-${{ matrix.arch }}
          path: dist/madc-*-macos-*.tar.gz
          if-no-files-found: error

  attach-release:
    runs-on: ubuntu-24.04
    needs: [linux-packages, windows-package, macos-package]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: attach assets at stable URLs (preserve other packagers' checksum lines)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd dist
          files=$(ls madc_*.deb madc-*.x86_64.rpm \
                     madc-*-linux-x86_64.tar.gz madc-*-windows-x86_64.zip \
                     madc-*-macos-arm64.tar.gz madc-*-macos-x86_64.tar.gz)
          echo "attaching to $RELEASE_TAG:"; echo "$files"
          if ! gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # CI never publishes: the DRAFT holds the stable asset set until
            # the owner's /promote ceremony writes the real notes and
            # publishes.
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
              --draft --title "$RELEASE_TAG" \
              --notes "Draft — CI-built Linux/Windows/macOS assets (install-gate smoked on each platform's runner). Release notes are written and the release published by the owner's /promote ceremony."
          fi
          # SHA256SUMS: rewrite our own lines only — a line for a file this
          # run does not upload survives (re-runs, partial re-dispatches).
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            -p SHA256SUMS -O SHA256SUMS.existing || true
          : > SHA256SUMS
          if [ -f SHA256SUMS.existing ]; then
            cp SHA256SUMS.existing SHA256SUMS
            for f in $files; do
              grep -v "  $f\$" SHA256SUMS > SHA256SUMS.tmp || true
              mv SHA256SUMS.tmp SHA256SUMS
            done
          fi
          sha256sum $files >> SHA256SUMS
          cat SHA256SUMS
          gh release upload "$RELEASE_TAG" $files SHA256SUMS \
            --clobber -R "$GITHUB_REPOSITORY"
