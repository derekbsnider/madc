# darwin-probe.yml — the darwin-host build gate (D1 of the darwin-host
# build port, docs/plans/2026-09-01-darwin-host-port.md).
#
# D0 measured the runner with pure `make` command-line overrides (zero repo
# changes) and proved the native build. D1 promoted that override set into
# the Makefile's DARWIN_HOST posture (auto-on when `uname -s` is Darwin:
# brew llvm@18 toolchain, Apple ld64, the xcrun SDK, brew zstd) — so this
# workflow is now a plain `make hosted-arm64-macos` on a real macos-14
# (arm64) runner, and it FAILS when the build or the hello does. The
# derived posture is echoed into the log as evidence (runner logs are all
# that survives the job).
#
# Still --with-forest=none: the hosted link's freezer is the CROSS madc
# (the container model); D2's native self-freeze replaces it.
#
# Dispatch-only; never wired to pushes or releases. The build-host
# prerequisites are the documented brew set; PATH gets brew's gnubin
# (Xcode's /usr/bin/make is GNU Make 3.81 — the Makefile refuses it).
name: darwin-probe
run-name: "darwin-host D1 gate (${{ inputs.build_ref || 'develop' }})"

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: 'ref to build (default develop)'
        required: false
        default: 'develop'

permissions:
  contents: read

jobs:
  gate-arm64:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref || 'develop' }}
      - name: inventory — what the runner actually has
        run: |
          sw_vers
          uname -m
          xcrun --show-sdk-path
          clang --version | head -1
          ld -v 2>&1 | head -1
          /usr/bin/make --version | head -1
      - name: brew deps (llvm@18 = the parity compiler) + the gnubin build-host userland
        run: |
          # automake: brew's autoreconf insists on aclocal even for a
          # plain-autoconf project (ubuntu's quietly skips it).
          brew install llvm@18 zstd autoconf automake coreutils gnu-sed grep bash make 2>&1 | tail -3
          for f in make coreutils gnu-sed grep; do
            echo "$(brew --prefix $f)/libexec/gnubin" >> "$GITHUB_PATH"
          done
          # The open-headers stage location: the fetch script's knob, which
          # the Makefile's DARWIN_PRELUDE_SYSROOT default reads too.
          echo "DARWIN_OPEN_HEADERS_HOME=$HOME/darwin-open-headers" >> "$GITHUB_ENV"
      - name: fetch darwin open headers
        run: |
          make --version | head -1
          bash scripts/fetch_darwin_open_headers.sh
          cat "$DARWIN_OPEN_HEADERS_HOME/sysroot-any-darwin-any/.PROVENANCE"
      - name: autoreconf + configure
        run: |
          autoreconf -i
          # --with-forest=none: see the header. --enable-madcdat=no: the
          # hosted MODE forces it off anyway; the runner's brew gdbm/sqlite
          # otherwise leak into probed defines. CPPFLAGS/LDFLAGS: configure's
          # host zstd probe needs the brew prefix on a Mac.
          ./configure --with-forest=none --enable-madcdat=no \
            CPPFLAGS="-I$(brew --prefix)/include" LDFLAGS="-L$(brew --prefix)/lib"
      - name: the derived DARWIN_HOST posture (evidence)
        run: |
          make -C src -pn MODE=hosted-arm64-macos ../bin/madc-hosted-arm64-macos 2>/dev/null \
            | grep -E '^(HOST_OS|DARWIN_HOST|DARWIN_LLVM_PREFIX|DARWIN_CLANG|DARWIN_CLANGXX|DARWIN_AR|DARWIN_STRIP|DARWIN_LD_FLAGS|DARWIN_ZSTD_PREFIX|DARWIN_ZSTD_INC|DARWIN_ZSTD_LIB|MACOS_SDK|LLVM_LIBCXX_INC|DARWIN_PRELUDE_SYSROOT) ' \
            | sort
      - name: build — plain make, no overrides
        run: |
          make -C src -j3 hosted-arm64-macos 2>&1 | tee probe-make.log
          test "${PIPESTATUS[0]}" -eq 0
          ls -la bin/madc-hosted-arm64-macos
      - name: run it — the D1 gate
        run: |
          printf 'var g = "darwin-host-gate-alive";\nprintln("{}", g);\n' > /tmp/gate.mad
          out=$(bin/madc-hosted-arm64-macos /tmp/gate.mad)
          echo "madc said: $out"
          test "$out" = "darwin-host-gate-alive"
          bin/madc-hosted-arm64-macos --version | head -1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darwin-probe-log
          path: probe-make.log
          if-no-files-found: warn
