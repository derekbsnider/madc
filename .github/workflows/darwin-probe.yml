# darwin-probe.yml — the darwin-host RELEASE gate (D2 of the darwin-host
# build port, docs/plans/2026-09-01-darwin-host-port.md).
#
# D0 measured the runner with pure `make` overrides; D1 promoted them into
# the Makefile's DARWIN_HOST posture (plain `make hosted-arm64-macos` —
# green, run 33573025122). D2 makes the runner-built binary a RELEASE
# candidate: `make release-macos` on a darwin host builds the host arch
# (serving the container's PINNED libc++ 18.1.3 header text, not brew's 18.1.8),
# freezes the darwin groves with the hosted binary ITSELF (self-freeze:
# phase-1 link without the forest section -> run it to write the standalone
# container -> the ordinary -sectcreate link), strips, and verifies the
# forest bytes + signature with verify_macho_release (reader = the hosted
# binary). Then the Mac battery runs against the stripped binary in a
# tarball-shaped stage. Both arches, on GitHub's arm64 and Intel runners —
# the Intel leg is the first x86_64 EXECUTION proof anywhere.
#
# D4 adds THE FULL-SUITE macOS LANE: scripts/run_tests.sh (JIT + exe passes)
# against the release-shaped binary — the packed-suite analogue Linux and
# Windows have had, never run on a Mac before. Domain posture
# MADC_SKIP_EXT=darwin (tests/<base>.darwin_{skip,expect,exe_skip} fixtures
# for genuinely divergent tests, oracle = clang on the runner) and
# MADC_EXE_FLAGS=-static-libmadc (an Apple-target program that needs the madc
# runtime fails at emit without it: no libmadc dylib ships until D5 — the
# darwin AOT lane IS the static one). The --obj pass is out of the darwin
# domain (no Mach-O relocatable writer yet; mac_battery leg 6 documents the
# loud decline) — stated here, not per test. `suite_gate=false` turns the
# suite into a MEASUREMENT (logs + failure list uploaded, job stays green)
# for the first-run triage; the default gates.
#
# Evidence goes to the log (all that survives the job) and the make/battery/
# suite logs upload as artifacts. Dispatch-only; never wired to pushes/releases.
name: darwin-probe
run-name: "darwin-host release gate + macOS suite (${{ inputs.build_ref || 'develop' }}, gate=${{ inputs.suite_gate || 'true' }})"

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: 'ref to build (default develop)'
        required: false
        default: 'develop'
      suite_gate:
        description: 'fail the job on suite failures (false = measure only: upload logs, stay green)'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  release-gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86-64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.build_ref || 'develop' }}
      - name: inventory — what the runner actually has
        run: |
          sw_vers
          uname -m
          sysctl -n hw.ncpu
          xcrun --show-sdk-path
          clang --version | head -1
          ld -v 2>&1 | head -1
          /usr/bin/make --version | head -1
          # Does the CLT SDK path (the prefix-map canonical the served include
          # tables name) EXIST here? If so a native freezer can open real SDK C
          # headers the container never sees — a corpus-parity + provenance risk.
          ls -d /Library/Developer/CommandLineTools/SDKs/*.sdk 2>&1 || echo "no CLT SDK path"
      - name: brew deps (llvm@18 = the parity compiler) + the gnubin build-host userland
        run: |
          # automake: brew's autoreconf insists on aclocal even for a
          # plain-autoconf project (ubuntu's quietly skips it).
          brew install llvm@18 zstd autoconf automake coreutils gnu-sed grep bash make 2>&1 | tail -3
          for f in make coreutils gnu-sed grep; do
            echo "$(brew --prefix $f)/libexec/gnubin" >> "$GITHUB_PATH"
          done
          # The two staged INPUT trees: each fetch script's own location knob,
          # which the Makefile's DARWIN_PRELUDE_SYSROOT / LLVM_LIBCXX_INC
          # darwin-host defaults read too.
          echo "DARWIN_OPEN_HEADERS_HOME=$HOME/darwin-open-headers" >> "$GITHUB_ENV"
          echo "LIBCXX_HEADERS_HOME=$HOME/libcxx-headers" >> "$GITHUB_ENV"
      - name: fetch the pinned input trees (darwin open C headers; the container's exact libc++ text)
        run: |
          make --version | head -1
          bash scripts/fetch_darwin_open_headers.sh
          cat "$DARWIN_OPEN_HEADERS_HOME/sysroot-any-darwin-any/.PROVENANCE"
          # brew llvm@18 is 18.1.8; the served C++ world is pinned to the
          # container's apt libc++-18-dev 18.1.3 text (see the script header).
          bash scripts/fetch_libcxx_headers.sh
          cat "$LIBCXX_HEADERS_HOME/.PROVENANCE"
      - name: autoreconf + configure (forest EMBEDDED — the default)
        run: |
          autoreconf -i
          # --enable-madcdat=no: the hosted MODE forces it off anyway; the
          # runner's brew gdbm/sqlite otherwise leak into probed defines.
          # CPPFLAGS/LDFLAGS: configure's host zstd probe needs the brew prefix.
          ./configure --enable-madcdat=no \
            CPPFLAGS="-I$(brew --prefix)/include" LDFLAGS="-L$(brew --prefix)/lib"
      - name: the derived DARWIN_HOST posture (evidence)
        run: |
          make -C src -pn MODE=hosted-${{ matrix.arch }}-macos ../bin/madc-hosted-${{ matrix.arch }}-macos 2>/dev/null \
            | grep -E '^(HOST_OS|HOST_ARCH|HOST_DARWIN_ARCH|DARWIN_HOST|DARWIN_SELF_FREEZE|DARWIN_FREEZER|DARWIN_LLVM_PREFIX|DARWIN_CLANG|DARWIN_CLANGXX|DARWIN_AR|DARWIN_STRIP|DARWIN_OTOOL|DARWIN_LD_FLAGS|DARWIN_ZSTD_PREFIX|DARWIN_ZSTD_INC|DARWIN_ZSTD_LIB|MACOS_SDK|LLVM_LIBCXX_INC|DARWIN_PRELUDE_SYSROOT|RELEASE_MACOS_ARCHES) ' \
            | sort
      - name: make release-macos — host arch, self-frozen, stripped, verified
        run: |
          make -C src -j"$(sysctl -n hw.ncpu)" release-macos 2>&1 | tee probe-make.log
          test "${PIPESTATUS[0]}" -eq 0
          echo "=== freeze + verify evidence ==="
          grep -E "forest_pack_gate:|forest_pack_darwin: OK|verify_macho_release:|Froze " probe-make.log
          ls -la bin/madc-hosted-${{ matrix.arch }}-macos bin/madc-release-${{ matrix.arch }}-macos \
                 obj/hosted-${{ matrix.arch }}-macos/forest.bin obj/hosted-${{ matrix.arch }}-macos/madc-freezer \
                 lib/libmadc_rt-hosted-${{ matrix.arch }}-macos.a
          echo "forest units (container cross-pack baseline: 835):"
          bin/madc-hosted-${{ matrix.arch }}-macos --dump-forest=obj/hosted-${{ matrix.arch }}-macos/forest.bin | grep -c '^unit	'
          # Freeze INPUTS + outputs for the corpus-parity diff against the
          # container (unit list, pack log, the generated TU, the host tables,
          # the prelude manifest) — collected into one dir for the artifact.
          mkdir -p tmp/freeze-evidence
          cp obj/hosted-${{ matrix.arch }}-macos/forest.bin.dump.txt obj/hosted-${{ matrix.arch }}-macos/forest.bin.freeze.log \
             obj/hosted-${{ matrix.arch }}-macos/forest.bin.tu.cpp obj/hosted-${{ matrix.arch }}-macos/sys_include_paths.cpp \
             obj/hosted-${{ matrix.arch }}-macos/darwin_prelude/.MANIFEST src/predefined_macros.cpp tmp/freeze-evidence/
          cp obj/hosted-${{ matrix.arch }}-macos/darwin_prelude/*.h tmp/freeze-evidence/ 2>/dev/null || true
          ls -la tmp/freeze-evidence
      - name: run the STRIPPED release binary — the hello gate
        run: |
          printf 'var g = "darwin-host-gate-alive";\nprintln("{}", g);\n' > /tmp/gate.mad
          out=$(bin/madc-release-${{ matrix.arch }}-macos /tmp/gate.mad)
          echo "madc said: $out"
          test "$out" = "darwin-host-gate-alive"
          bin/madc-release-${{ matrix.arch }}-macos --version | head -1
      - name: mac battery on the runner (tarball-shaped stage)
        run: |
          # The battery expects the tarball layout: bin/madc + lib/libmadc_rt.a
          # beside it (leg 6c). Owner-hardware baseline: 8 passed / 3 failed
          # (three standing known-opens) — the gate holds the PASS floor and
          # prints every FAIL line for the leg-for-leg compare.
          mkdir -p tmp/stage/bin tmp/stage/lib
          cp bin/madc-release-${{ matrix.arch }}-macos tmp/stage/bin/madc
          cp lib/libmadc_rt-hosted-${{ matrix.arch }}-macos.a tmp/stage/lib/libmadc_rt.a
          set +e
          bash scripts/mac_battery.sh tmp/stage/bin/madc 2>&1 | tee mac-battery.log
          set -e
          echo "=== FAIL lines (compare leg-for-leg with the owner-hardware 8/3 baseline) ==="
          grep -E '^FAIL' mac-battery.log || echo "(none)"
          passed=$(sed -n 's/^== battery: \([0-9]*\) passed.*/\1/p' mac-battery.log)
          echo "passed=$passed (floor 8)"
          test -n "$passed"
          test "$passed" -ge 8
      - name: the full suite on the runner — JIT + exe passes, darwin domain (the macOS lane)
        run: |
          # Release-shaped binary (the packed-suite analogue), hermetic runner
          # flags, darwin domain fixtures, static AOT link. --obj deliberately
          # absent (see the header). tests/ is the checkout's; /tmp is the
          # runner's. Wall time is measured here, not assumed.
          date -u +%FT%TZ
          set +e
          MADC_BIN=bin/madc-release-${{ matrix.arch }}-macos MADC_SKIP_EXT=darwin \
          MADC_EXE_FLAGS=-static-libmadc MADC_FAIL_DETAIL=12 \
            bash scripts/run_tests.sh --exe 2>&1 | tee suite.log
          rc=${PIPESTATUS[0]}
          set -e
          date -u +%FT%TZ
          grep -E '^(FAIL|TIMEOUT)' suite.log | sort > suite-failures.txt || true
          echo "=== suite summary ==="
          tail -4 suite.log
          echo "failure lines: $(wc -l < suite-failures.txt)   suite rc=$rc"
          if [ "${{ inputs.suite_gate || 'true' }}" = "true" ]; then
            exit "$rc"
          else
            echo "suite_gate=false — MEASUREMENT run; failures are triage input, not a verdict"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: darwin-release-gate-${{ matrix.arch }}
          path: |
            probe-make.log
            mac-battery.log
            suite.log
            suite-failures.txt
            tmp/freeze-evidence/
          if-no-files-found: warn
