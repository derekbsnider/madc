# darwin-probe.yml — D0 of the darwin-host build port
# (docs/plans/2026-09-01-darwin-host-port.md).
#
# MEASUREMENT, not a build: drive the existing hosted-arm64-macos MODE
# on a real macos-14 (arm64) runner with pure `make` command-line
# overrides (they beat even hard `=` mode assignments) — zero repo
# changes — and catalog exactly where it breaks. The full make log is
# the deliverable, uploaded as an artifact either way.
#
# Expected early walls (from the plan doc): parse-time generator
# scripts under the mac shell; the freeze step (the runner has no
# cross madc — that is D2's self-freeze job). Everything the probe
# clears is a D1 knob confirmed; everything it hits is a catalogued
# fact with its log line.
#
# Dispatch-only; never wired to pushes or releases.
name: darwin-probe
run-name: "darwin-host D0 probe (${{ inputs.build_ref || 'develop' }})"

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: 'ref to probe (default develop)'
        required: false
        default: 'develop'

permissions:
  contents: read

jobs:
  probe-arm64:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref || 'develop' }}
      - name: inventory — what the runner actually has
        run: |
          sw_vers
          uname -m
          xcode-select -p
          xcrun --show-sdk-path
          clang --version | head -2
          ld -v 2>&1 | head -1
          bash --version | head -1
          make --version | head -1
          python3 --version
          brew --version | head -1
          which autoconf autoreconf shasum sha256sum gtimeout 2>&1 || true
      - name: brew deps (llvm@18 = the parity compiler; zstd for configure + stage)
        run: |
          brew install llvm@18 zstd autoconf coreutils gnu-sed grep bash make 2>&1 | tail -5
          LLVM=$(brew --prefix llvm@18)
          echo "llvm prefix: $LLVM"
          ls "$LLVM/bin" | head -20
          "$LLVM/bin/clang" --version | head -1
          ls -d "$LLVM/include/c++/v1" && echo "libc++ headers present"
      - name: fetch darwin open headers (script portability under mac shell)
        run: |
          export DARWIN_OPEN_HEADERS_HOME="$HOME/darwin-open-headers"
          bash scripts/fetch_darwin_open_headers.sh
          cat "$HOME/darwin-open-headers/sysroot-any-darwin-any/.PROVENANCE"
      - name: zstd stage shim (probe-grade — brew static lib under the stage layout)
        run: |
          Z=$(brew --prefix zstd)
          mkdir -p "$HOME/zstd-stage/lib"
          cp "$Z/lib/libzstd.a" "$HOME/zstd-stage/libzstd-arm64-macos.a"
          cp "$Z/include/zstd.h" "$Z/include/zstd_errors.h" "$HOME/zstd-stage/lib/"
          ls -la "$HOME/zstd-stage" "$HOME/zstd-stage/lib"
      - name: autoreconf + configure (brew prefixes for the host zstd check)
        run: |
          autoreconf -i
          ./configure CPPFLAGS="-I$(brew --prefix)/include" LDFLAGS="-L$(brew --prefix)/lib"
      - name: the probe — hosted-arm64-macos with native-toolchain overrides
        run: |
          set +e
          LLVM=$(brew --prefix llvm@18)
          SDK=$(xcrun --show-sdk-path)
          TGT="arm64-apple-macos12"
          make -C src -j3 hosted-arm64-macos \
            MACOS_SDK="$SDK" \
            "CC=$LLVM/bin/clang -target $TGT --sysroot $SDK" \
            "CXX_BASE=$LLVM/bin/clang++ -target $TGT --sysroot $SDK" \
            AR="$LLVM/bin/llvm-ar" \
            "HOSTTAB_CXX=$LLVM/bin/clang++ -target $TGT --sysroot $SDK -nostdinc++ -isystem $LLVM/include/c++/v1" \
            LLVM_LIBCXX_INC="$LLVM/include/c++/v1" \
            DARWIN_PRELUDE_SYSROOT="$HOME/darwin-open-headers/sysroot-any-darwin-any" \
            DARWIN_ZSTD_DIR="$HOME/zstd-stage" \
            "LIBS=-lz -lm $HOME/zstd-stage/libzstd-arm64-macos.a" \
            > probe-make.log 2>&1
          rc=$?
          echo "=== make exit: $rc ==="
          echo "=== last 80 lines ==="
          tail -80 probe-make.log
          echo "=== products ==="
          ls -la bin obj/hosted-arm64-macos 2>/dev/null || true
          # The probe never fails the workflow: the log is the deliverable.
          exit 0
      - name: run it if it exists (the D1 gate, early)
        run: |
          if [ -x bin/madc-hosted-arm64-macos ]; then
            printf 'var g = "darwin-host-probe-alive";\nprintln("{}", g);\n' > /tmp/probe.mad
            bin/madc-hosted-arm64-macos /tmp/probe.mad || echo "run rc=$?"
          else
            echo "no hosted binary produced (expected until D1/D2 land)"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darwin-probe-log
          path: probe-make.log
          if-no-files-found: warn
