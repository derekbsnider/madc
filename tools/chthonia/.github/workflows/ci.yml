# ci.yml — Chthonia built, tested and packaged against an installed madc on
# Linux, Windows and macOS: each job installs madc from a madc release's
# assets, then runs Chthonia's own scripts (scripts/).
#
# The madc release is v<chthonia.json's "madc"> (the oldest madc that builds
# Chthonia), or the dispatch's madc_tag. A draft release's assets read with
# the MADC_RELEASES_TOKEN secret (read access to madc's releases); a
# published release's read with the workflow's own token.
#
# A v* tag also drafts Chthonia's release with every package and their
# SHA256SUMS; the tag must be v<CHTHONIA_VERSION> (chthonia_version.h).
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      madc_tag:
        description: "the madc release to build against (default: v<chthonia.json's madc>)"
        required: false
        default: ''

env:
  MADC_REPO: derekbsnider/madc

jobs:
  madc:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        env:
          WANT: ${{ inputs.madc_tag }}
        run: |
          tag=$WANT
          if [ -z "$tag" ]; then
            min=$(sed -n 's/^[[:space:]]*"madc":[[:space:]]*"\([0-9.]*\)".*/\1/p' chthonia.json)
            if [ -z "$min" ]; then
              echo "chthonia.json names no \"madc\" release" >&2
              exit 1
            fi
            tag=v$min
          fi
          echo "madc $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  linux:
    runs-on: ubuntu-24.04
    needs: madc
    env:
      MADC_TAG: ${{ needs.madc.outputs.tag }}
      GH_TOKEN: ${{ secrets.MADC_RELEASES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: dependencies (the window's libraries, the display for its tests, rpmbuild)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkitgtk-6.0-4 libgtk-4-1 xvfb rpm
      - name: madc, from its release's tarball
        run: |
          gh release download "$MADC_TAG" -R "$MADC_REPO" -p 'madc-*-linux-x86_64.tar.gz' -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/madc-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          folder=$(ls -d "$RUNNER_TEMP"/madc-*-linux-x86_64)
          echo "MADC_FOLDER=$folder" >> "$GITHUB_ENV"
          echo "MADC=$folder/bin/madc" >> "$GITHUB_ENV"
      - name: build
        run: bash scripts/build.sh
      - name: tests
        run: bash scripts/run_tests.sh
      - name: window tests
        run: xvfb-run -a bash scripts/run_tests.sh --gui
      - name: packages (.deb, .rpm, tarball)
        run: bash scripts/package_linux.sh
      - name: installed — the tarball unpacked into the madc folder
        run: |
          tar -xzf dist/chthonia-*-linux-x86_64.tar.gz -C "$MADC_FOLDER"
          bash scripts/check_install.sh "$MADC_FOLDER"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/chthonia_*.deb
            dist/chthonia-*.rpm
            dist/chthonia-*-linux-*.tar.gz
          if-no-files-found: error

  linux-jammy:
    # Ubuntu 22.04's .deb, built on 22.04 against madc's 22.04 .deb (one
    # .deb per Ubuntu release, as madc's). Installed with apt for the build;
    # checked as a package root, both packages unpacked into it.
    runs-on: ubuntu-22.04
    needs: madc
    env:
      MADC_TAG: ${{ needs.madc.outputs.tag }}
      GH_TOKEN: ${{ secrets.MADC_RELEASES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: madc, from its release's 22.04 .deb
        run: |
          gh release download "$MADC_TAG" -R "$MADC_REPO" -p 'madc_*~ubuntu22.04_amd64.deb' -D "$RUNNER_TEMP"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "$RUNNER_TEMP"/madc_*~ubuntu22.04_amd64.deb xvfb
          echo "MADC=/usr/bin/madc" >> "$GITHUB_ENV"
      - name: build
        run: bash scripts/build.sh
      - name: tests
        run: bash scripts/run_tests.sh
      - name: window tests
        run: xvfb-run -a bash scripts/run_tests.sh --gui
      - name: package (.deb)
        run: bash scripts/package_linux.sh --deb
      - name: installed — both packages unpacked into one root
        run: |
          root=$RUNNER_TEMP/root
          dpkg-deb -x "$RUNNER_TEMP"/madc_*~ubuntu22.04_amd64.deb "$root"
          dpkg-deb -x dist/chthonia_*~ubuntu22.04_amd64.deb "$root"
          bash scripts/check_install.sh "$root/usr" "$root/usr/lib/x86_64-linux-gnu"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-jammy
          path: dist/chthonia_*~ubuntu22.04_amd64.deb
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: madc
    defaults:
      run:
        shell: bash
    env:
      MADC_TAG: ${{ needs.madc.outputs.tag }}
      GH_TOKEN: ${{ secrets.MADC_RELEASES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: zip and unzip
        run: choco install zip unzip -y --no-progress
      - name: madc, from its release's zip
        run: |
          tmp=$(cygpath -u "$RUNNER_TEMP")
          gh release download "$MADC_TAG" -R "$MADC_REPO" -p 'madc-*-windows-x86_64.zip' -D "$tmp"
          unzip -q "$tmp"/madc-*-windows-x86_64.zip -d "$tmp"
          echo "MADC=$(ls -d "$tmp"/madc-*-windows-x86_64)/bin/madc.exe" >> "$GITHUB_ENV"
      - name: build
        run: bash scripts/build.sh
      - name: tests
        run: bash scripts/run_tests.sh
      - name: package (zip)
        run: bash scripts/package_windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/chthonia-*-windows-x86_64.zip
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    needs: madc
    env:
      MADC_TAG: ${{ needs.madc.outputs.tag }}
      GH_TOKEN: ${{ secrets.MADC_RELEASES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: coreutils (gtimeout)
        run: brew install coreutils
      - name: madc, from its release's tarball
        run: |
          gh release download "$MADC_TAG" -R "$MADC_REPO" -p "madc-*-macos-${{ matrix.arch }}.tar.gz" -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/madc-*-macos-${{ matrix.arch }}.tar.gz -C "$RUNNER_TEMP"
          folder=$(ls -d "$RUNNER_TEMP"/madc-*-macos-${{ matrix.arch }})
          echo "MADC_FOLDER=$folder" >> "$GITHUB_ENV"
          echo "MADC=$folder/bin/madc" >> "$GITHUB_ENV"
      - name: build
        run: bash scripts/build.sh
      - name: tests
        run: bash scripts/run_tests.sh
      - name: package (tarball)
        run: bash scripts/package_macos.sh
      - name: installed — the tarball unpacked into the madc folder
        run: |
          tar -xzf dist/chthonia-*-macos-*.tar.gz -C "$MADC_FOLDER"
          bash scripts/check_install.sh "$MADC_FOLDER"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/chthonia-*-macos-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-jammy, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: the tag is Chthonia's version
        run: |
          ver=$(sed -n 's/^#define CHTHONIA_VERSION "\(.*\)"$/\1/p' chthonia_version.h)
          if [ "$GITHUB_REF_NAME" != "v$ver" ]; then
            echo "tag $GITHUB_REF_NAME is not v$ver (chthonia_version.h)" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: draft the release
        run: |
          cd dist
          sha256sum chthonia* > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft \
            --title "Chthonia ${GITHUB_REF_NAME#v}" \
            --notes "Draft: the packages CI built and checked on Linux, Windows and macOS." \
            chthonia* SHA256SUMS
